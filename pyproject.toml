[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitepulse-django"
version = "0.1.0"
description = "Django client integration for SitePulse first-party analytics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Upper bound is the next major, not the current one. The package touches only
  # AppConfig, settings, cache, BaseCommand, the db exceptions, models,
  # HttpRequest/JsonResponse, path, timezone, csrf_exempt and require_POST —
  # none of which moved in 5.x or 6.x. Capping at <5.3 meant installing this
  # into a Django 6 host silently downgraded that host's framework.
  "Django>=4.2,<7",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-django>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["sitepulse*"]

[tool.setuptools.package-data]
"sitepulse.django" = ["static/sitepulse/runtime-core.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
